name: Native platform validation

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      focus:
        description: Validation scope
        type: choice
        default: full
        options: [full, host-trust, windows-trust]

permissions:
  contents: read

jobs:
  embedding-diagnostics:
    if: inputs.focus != 'host-trust' && inputs.focus != 'windows-trust' && !contains(github.event.head_commit.message, '-trust]')
    name: Embeddings ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      CONTEXT_SAVER_TEST_REPORTS: ${{ github.workspace }}/test-reports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
      - name: Install local model runtime
        run: uv pip install --system fastembed==0.9.1 usearch==2.26.6
      - name: Compare exact and indexed retrieval
        timeout-minutes: 5
        run: python tests/embedding_diagnostics.py
      - name: Save model diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embeddings-${{ matrix.os }}
          path: ${{ github.workspace }}/test-reports
          if-no-files-found: error
  native-platform:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.focus == 'windows-trust' || contains(github.event.head_commit.message, '[windows-trust]')) && '["windows-2025"]' || '["ubuntu-24.04","windows-2025","macos-15"]') }}
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      UV_PYTHON: "3.12"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      DO_NOT_TRACK: "1"
      DISABLE_AUTOUPDATER: "1"
      CONTEXT_SAVER_REQUIRE_NATIVE_MODEL: "1"
      CONTEXT_SAVER_TEST_REPORTS: ${{ github.workspace }}/test-reports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
      - name: Install pinned test runtime
        run: uv pip install --system mcp==1.26.0 fastembed==0.9.1 usearch==2.26.6 onnx==1.23.2
      - name: Install native coding hosts
        run: npm install --global @openai/codex@0.157.1 @anthropic-ai/claude-code@2.1.312
      - name: Install Windows terminal adapter
        if: runner.os == 'Windows'
        run: uv pip install --system pywinpty==3.0.2
      - name: Install browser
        if: inputs.focus != 'host-trust' && inputs.focus != 'windows-trust' && !contains(github.event.head_commit.message, '-trust]')
        working-directory: tests/browser
        run: |
          npm install --ignore-scripts --no-package-lock
          npx playwright install --with-deps chromium
      - name: Run regression and native runtime tests
        if: inputs.focus != 'host-trust' && inputs.focus != 'windows-trust' && !contains(github.event.head_commit.message, '-trust]')
        timeout-minutes: 5
        run: python tests/run.py
      - name: Run terminal driver regression tests
        if: inputs.focus == 'host-trust' || inputs.focus == 'windows-trust' || contains(github.event.head_commit.message, '-trust]')
        run: python -m unittest discover -s tests -p test_terminal_arguments.py -v
      - name: Run browser regression tests
        if: always() && inputs.focus != 'host-trust' && inputs.focus != 'windows-trust' && !contains(github.event.head_commit.message, '-trust]')
        timeout-minutes: 5
        working-directory: tests/browser
        run: |
          npm test
          npm run test:e2e
      - name: Run installed host acceptance
        if: always()
        timeout-minutes: 5
        run: python tests/native_hosts.py
      - name: Review native trust and upgrade
        if: always()
        timeout-minutes: 8
        run: python tests/native_trust.py
      - name: Save synthetic diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-saver-${{ matrix.os }}
          path: ${{ github.workspace }}/test-reports
          if-no-files-found: warn
