name: Native platform validation

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      focus:
        description: Validation scope
        type: choice
        default: full
        options: [full, host-trust, windows-trust, viewer-ui, viewer-windows]

permissions:
  contents: read

jobs:
  embedding-diagnostics:
    if: inputs.focus != 'viewer-windows' && !contains(github.event.head_commit.message, '[viewer-windows]') && inputs.focus != 'viewer-ui' && !contains(github.event.head_commit.message, '[viewer-ui]') && inputs.focus != 'host-trust' && inputs.focus != 'windows-trust' && !contains(github.event.head_commit.message, '-trust]')
    name: Embeddings ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      CONTEXT_SAVER_TEST_REPORTS: ${{ github.workspace }}/test-reports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
      - name: Install local model runtime
        run: uv pip install --system fastembed==0.9.1 usearch==2.26.6 umap-learn==0.5.12 hdbscan==0.8.44
      - name: Compare exact and indexed retrieval
        timeout-minutes: 5
        run: python tests/embedding_diagnostics.py
      - name: Save model diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embeddings-${{ matrix.os }}
          path: ${{ github.workspace }}/test-reports
          if-no-files-found: error
  native-platform:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.focus == 'viewer-windows' || contains(github.event.head_commit.message, '[viewer-windows]') || (inputs.focus != 'viewer-ui' && !contains(github.event.head_commit.message, '[viewer-ui]') && (inputs.focus == 'windows-trust' || contains(github.event.head_commit.message, '[windows-trust]')))) && '["windows-2025"]' || '["ubuntu-24.04","windows-2025","macos-15"]') }}
    env:
      # viewer-ui runs every Node/Chromium case on all three OSes, including
      # real HTTP/SQLite fixtures. viewer-windows repeats only the mocked modal
      # navigation cases and Node checks. Neither repeats model/host acceptance.
      VIEWER_WINDOWS_ONLY: ${{ inputs.focus == 'viewer-windows' || contains(github.event.head_commit.message, '[viewer-windows]') }}
      VIEWER_UI_ONLY: ${{ inputs.focus == 'viewer-ui' || contains(github.event.head_commit.message, '[viewer-ui]') || inputs.focus == 'viewer-windows' || contains(github.event.head_commit.message, '[viewer-windows]') }}
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      UV_PYTHON: "3.12"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      DO_NOT_TRACK: "1"
      DISABLE_AUTOUPDATER: "1"
      CONTEXT_SAVER_REQUIRE_NATIVE_MODEL: "1"
      CONTEXT_SAVER_TEST_REPORTS: ${{ github.workspace }}/test-reports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: env.VIEWER_WINDOWS_ONLY != 'true'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
        if: env.VIEWER_WINDOWS_ONLY != 'true'
        with:
          version: "0.9.5"
      - name: Install pinned test runtime
        if: env.VIEWER_WINDOWS_ONLY != 'true'
        run: uv pip install --system mcp==1.26.0 fastembed==0.9.1 usearch==2.26.6 umap-learn==0.5.12 hdbscan==0.8.44 onnx==1.23.2
      - name: Install native coding hosts
        if: env.VIEWER_UI_ONLY != 'true'
        run: npm install --global @openai/codex@0.157.1 @anthropic-ai/claude-code@2.1.312
      - name: Install Windows terminal adapter
        if: runner.os == 'Windows' && env.VIEWER_UI_ONLY != 'true'
        run: uv pip install --system pywinpty==3.0.2
      - name: Configure bounded Ubuntu package downloads
        if: runner.os == 'Linux' && (env.VIEWER_UI_ONLY == 'true' || (inputs.focus != 'host-trust' && inputs.focus != 'windows-trust' && !contains(github.event.head_commit.message, '-trust]')))
        shell: bash
        run: |
          # Only the disposable runner's regional Ubuntu mirror changes;
          # official repositories and Playwright's required dependency install remain enabled.
          sudo python3 - <<'PY'
          from pathlib import Path
          import re

          regional = re.compile(r"https?://[a-z0-9-]+\.ec2\.archive\.ubuntu\.com/ubuntu(?=/|\s|$)")
          paths = [Path("/etc/apt/sources.list"), Path("/etc/apt/apt-mirrors.txt")]
          paths += list(Path("/etc/apt/sources.list.d").glob("*.list"))
          paths += list(Path("/etc/apt/sources.list.d").glob("*.sources"))
          replacements = 0
          for path in paths:
              if path.is_file():
                  text, count = regional.subn("https://archive.ubuntu.com/ubuntu", path.read_text())
                  if count:
                      path.write_text(text)
                      replacements += count
          Path("/etc/apt/apt.conf.d/99-context-saver-ci-network").write_text(
              'Acquire::http::Timeout "20";\n'
              'Acquire::https::Timeout "20";\n'
              'Acquire::Retries "1";\n'
          )
          print(f"Canonicalized {replacements} regional Ubuntu mirror URL(s).")
          PY
      - name: Install browser
        if: env.VIEWER_UI_ONLY == 'true' || (inputs.focus != 'host-trust' && inputs.focus != 'windows-trust' && !contains(github.event.head_commit.message, '-trust]'))
        timeout-minutes: ${{ runner.os == 'Linux' && 5 || 30 }}
        working-directory: tests/browser
        run: |
          npm install --ignore-scripts --no-package-lock
          npx playwright install --with-deps chromium
      - name: Run regression and native runtime tests
        if: env.VIEWER_UI_ONLY != 'true' && inputs.focus != 'host-trust' && inputs.focus != 'windows-trust' && !contains(github.event.head_commit.message, '-trust]')
        timeout-minutes: 5
        run: python tests/run.py
      - name: Run terminal and host-probe regression tests
        if: env.VIEWER_UI_ONLY != 'true' && (inputs.focus == 'host-trust' || inputs.focus == 'windows-trust' || contains(github.event.head_commit.message, '-trust]'))
        run: |
          python -m unittest discover -s tests -p test_terminal_arguments.py -v
          python -m unittest discover -s tests -p test_native_host_diagnostics.py -v
      - name: Run browser regression tests
        if: always() && env.VIEWER_WINDOWS_ONLY != 'true' && (env.VIEWER_UI_ONLY == 'true' || (inputs.focus != 'host-trust' && inputs.focus != 'windows-trust' && !contains(github.event.head_commit.message, '-trust]')))
        # Includes the real-animation interruption and repeated modal cases.
        timeout-minutes: 8
        working-directory: tests/browser
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/test-reports/browser-results.json
        run: |
          npm test
          npm run test:e2e -- --reporter=list,json
      - name: Run Windows modal navigation regressions
        if: always() && env.VIEWER_WINDOWS_ONLY == 'true'
        timeout-minutes: 5
        working-directory: tests/browser
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/test-reports/browser-results.json
        run: |
          npm test
          npm run test:e2e -- viewer-modal-navigation.spec.js --reporter=list,json
      - name: Run installed host acceptance
        if: always() && env.VIEWER_UI_ONLY != 'true'
        timeout-minutes: 5
        run: python tests/native_hosts.py
      - name: Review native trust and upgrade
        if: always() && env.VIEWER_UI_ONLY != 'true'
        timeout-minutes: 8
        run: python tests/native_trust.py
      - name: Save synthetic diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-saver-${{ matrix.os }}
          path: ${{ github.workspace }}/test-reports
          if-no-files-found: warn
