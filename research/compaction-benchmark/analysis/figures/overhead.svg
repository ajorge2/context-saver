<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
<title id="title">The accuracy gain also added time and token usage</title>
<desc id="desc">After three compactions: mean fork-and-answer latency and input/output token usage across six answers per arm. Cached input is part of input, not an extra token subtotal.</desc>
<rect width="100%" height="100%" rx="12" fill="#f8fafc"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#172033">
<text x="32" y="42" font-size="23" font-weight="700">The accuracy gain also added time and token usage</text>
<text x="32" y="70" font-size="15">After three compactions · six answers per arm · mean observed usage</text>
<text x="32" y="115" font-size="18" font-weight="700">Fork-and-answer seconds</text>
<text x="32" y="155" font-size="15">Context Saver off</text>
<rect x="200" y="135" width="213.270" height="29" fill="#64748b" rx="4"/>
<text x="428.270" y="156" font-size="16">8.20 s</text>
<text x="32" y="202" font-size="15">Context Saver on</text>
<rect x="200" y="182" width="516.590" height="29" fill="#2563eb" rx="4"/>
<text x="731.590" y="203" font-size="16">19.87 s</text>
<text x="32" y="270" font-size="18" font-weight="700">Input plus output tokens (cached input counted once)</text>
<text x="32" y="315" font-size="15">Context Saver off</text>
<rect x="200.000" y="295" width="49.920" height="29" fill="#93c5fd"/>
<rect x="249.920" y="295" width="49.219" height="29" fill="#2563eb"/>
<rect x="299.139" y="295" width="3.214" height="29" fill="#c2410c"/>
<text x="314.353" y="316" font-size="16">9,448.0</text>
<text x="32" y="365" font-size="15">Context Saver on</text>
<rect x="200.000" y="345" width="372.320" height="29" fill="#93c5fd"/>
<rect x="572.320" y="345" width="219.175" height="29" fill="#2563eb"/>
<rect x="791.495" y="345" width="6.868" height="29" fill="#c2410c"/>
<text x="810.363" y="366" font-size="16">55,233.5</text>
<rect x="32" y="405" width="16" height="16" fill="#93c5fd"/>
<text x="57" y="418" font-size="14">Cached input</text>
<rect x="220" y="405" width="16" height="16" fill="#2563eb"/>
<text x="245" y="418" font-size="14">Uncached input</text>
<rect x="445" y="405" width="16" height="16" fill="#c2410c"/>
<text x="470" y="418" font-size="14">Output</text>
<text x="32" y="463" font-size="14">Observed token usage is not a bill: cached input and output can have different prices.</text>
<text x="32" y="487" font-size="14">Shared native compaction costs are reported separately and are not plugin overhead.</text>
</g></svg>
