<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="565" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc">
<title id="title">Decision accuracy before and after chat compaction</title>
<desc id="desc">Correct operational fields out of 36 per condition. Six synthetic incidents, six fields each. Historical blinded AI semantic grades.</desc>
<rect width="100%" height="100%" rx="12" fill="#f8fafc"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#172033">
<text x="32" y="42" font-size="23" font-weight="700">Decision accuracy before and after chat compaction</text>
<text x="32" y="70" font-size="15">Six synthetic incidents × six operational fields; historical blinded AI semantic grades</text>
<text x="32" y="129" font-size="14">Before compaction · Context Saver off</text>
<rect x="432" y="112" width="450" height="26" rx="4" fill="#e2e8f0"/>
<rect x="432" y="112" width="450.000" height="26" rx="4" fill="#b45309"/>
<text x="898" y="130" font-size="16" font-weight="700">36/36</text>
<text x="32" y="183" font-size="14">Before compaction · Context Saver on</text>
<rect x="432" y="166" width="450" height="26" rx="4" fill="#e2e8f0"/>
<rect x="432" y="166" width="450.000" height="26" rx="4" fill="#2563eb"/>
<text x="898" y="184" font-size="16" font-weight="700">36/36</text>
<text x="32" y="237" font-size="14">After one compaction · Context Saver off</text>
<rect x="432" y="220" width="450" height="26" rx="4" fill="#e2e8f0"/>
<rect x="432" y="220" width="300.000" height="26" rx="4" fill="#b45309"/>
<text x="898" y="238" font-size="16" font-weight="700">24/36</text>
<text x="32" y="291" font-size="14">After one compaction · Context Saver on</text>
<rect x="432" y="274" width="450" height="26" rx="4" fill="#e2e8f0"/>
<rect x="432" y="274" width="400.000" height="26" rx="4" fill="#2563eb"/>
<text x="898" y="292" font-size="16" font-weight="700">32/36</text>
<text x="32" y="345" font-size="14">After three compactions · Context Saver off</text>
<rect x="432" y="328" width="450" height="26" rx="4" fill="#e2e8f0"/>
<rect x="432" y="328" width="237.500" height="26" rx="4" fill="#b45309"/>
<text x="898" y="346" font-size="16" font-weight="700">19/36</text>
<text x="32" y="399" font-size="14">After three compactions · Context Saver on</text>
<rect x="432" y="382" width="450" height="26" rx="4" fill="#e2e8f0"/>
<rect x="432" y="382" width="412.500" height="26" rx="4" fill="#2563eb"/>
<text x="898" y="400" font-size="16" font-weight="700">33/36</text>
<text x="32" y="453" font-size="14">Same intervening work, never compacted · off</text>
<rect x="432" y="436" width="450" height="26" rx="4" fill="#e2e8f0"/>
<rect x="432" y="436" width="437.500" height="26" rx="4" fill="#64748b"/>
<text x="898" y="454" font-size="16" font-weight="700">35/36</text>
<text x="32" y="520" font-size="14">Two controls per answer are excluded. The 36 fields are correlated within the six incidents.</text>
<text x="32" y="544" font-size="14">Off/on answer forks share the same question and history checkpoint; this is one archived run.</text>
</g></svg>
